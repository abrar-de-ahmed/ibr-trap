<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>Social Agent Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
    }

    .header {
      background: #16213e;
      padding: 12px 16px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e94560;
    }

    .header .version {
      font-size: 10px;
      background: #0f3460;
      padding: 2px 6px;
      border-radius: 4px;
      color: #a0a0a0;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #16213e;
    }

    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.connected { background: #00c851; box-shadow: 0 0 6px #00c85180; }
    .status-dot.disconnected { background: #ff1744; box-shadow: 0 0 6px #ff174480; }
    .status-dot.connecting { background: #ffc107; box-shadow: 0 0 6px #ffc10780; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 12px;
    }

    .status-text.ok { color: #00c851; }
    .status-text.err { color: #ff1744; }
    .status-text.warn { color: #ffc107; }

    .last-post {
      background: #16213e;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .last-post .label {
      font-size: 10px;
      color: #666;
      margin-bottom: 4px;
    }

    .last-post .platform {
      font-weight: 600;
      font-size: 13px;
      color: #e94560;
      text-transform: capitalize;
    }

    .last-post .result {
      font-size: 11px;
      margin-top: 4px;
    }

    .last-post .result.success { color: #00c851; }
    .last-post .result.fail { color: #ff1744; }

    .last-post .url {
      font-size: 10px;
      color: #64b5f6;
      word-break: break-all;
      margin-top: 3px;
    }

    .last-post .timestamp {
      font-size: 9px;
      color: #555;
      margin-top: 4px;
    }

    .no-post {
      color: #555;
      font-size: 11px;
      font-style: italic;
    }

    .reconnect-btn {
      width: 100%;
      padding: 8px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #e94560;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .reconnect-btn:hover {
      background: #e94560;
      color: #fff;
    }

    .footer {
      padding: 8px 16px;
      text-align: center;
      font-size: 9px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Social Agent Bridge</h1>
    <span class="version">v1.0.0</span>
  </div>

  <div class="section">
    <div class="section-title">Connection</div>
    <div class="status-row">
      <div id="statusDot" class="status-dot disconnected"></div>
      <span id="statusText" class="status-text err">Initializing...</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Last Post Result</div>
    <div id="lastPost" class="last-post">
      <span class="no-post">No posts yet</span>
    </div>
  </div>

  <div class="section">
    <button id="reconnectBtn" class="reconnect-btn">Reconnect to Bridge</button>
  </div>

  <div class="footer">
    WebSocket Bridge &middot; localhost:9876
  </div>

  <script src="popup.js"></script>
</body>
</html>
