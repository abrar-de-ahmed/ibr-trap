name: Social Agent - Puppeteer Auto-Posting + Engagement

on:
  schedule:
    # Daily at 10:00 UTC (3:00 PM PKT)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  social-engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome dependencies + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libdrm2 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 \
            libxshmfence1 libx11-xcb1 \
            xvfb

      - name: Install Puppeteer + dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth nodemailer

      - name: Run Social Agent v2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Reddit credentials
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_EMAIL: ${{ secrets.REDDIT_EMAIL }}
          REDDIT_OAUTH_TOKEN: ${{ secrets.REDDIT_OAUTH_TOKEN }}
          # Twitter/X credentials
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          # Pinterest credentials
          PINTEREST_USERNAME: ${{ secrets.PINTEREST_USERNAME }}
          PINTEREST_PASSWORD: ${{ secrets.PINTEREST_PASSWORD }}
          PINTEREST_EMAIL: ${{ secrets.PINTEREST_EMAIL }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node .github/workflows/scripts/social-agent.js
